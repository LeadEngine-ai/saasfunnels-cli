name: SaaSFunnels Feature catalog drift
description: Reports Feature catalog drift before merge, and records the catalog on the default branch.
author: SaaSFunnels

inputs:
  api-key:
    description: Workspace API key with the features:write scope. Store it as a repository secret.
    required: true
  api-base-url:
    description: Override for localhost or preview environments.
    required: false
    default: https://app.saasfunnels.ai
  catalog-file:
    description: Path to the Feature catalog manifest.
    required: false
    default: .saasfunnels/catalog.yaml
  cli-version:
    description: Exact saasfunnels version. Pin it — a floating version changes every drift baseline at once.
    required: true
  discovery-roots:
    description: Comma-separated discovery roots. Changing this starts a new drift lineage.
    required: false
    default: ""
  plan-sources:
    description: >-
      Upload the plan and pricing files listed in .saasfunnels/plan-sources.json
      so plan mapping stays current. Off by default: unlike the drift manifest,
      which sends only file:line references, this uploads file contents. Turn it
      on only once someone has reviewed and committed that list.
    required: false
    default: "false"
  integration-id:
    description: Stripe integration the plan mapping evidence belongs to. Required when plan-sources is true.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Report Feature catalog drift
      shell: bash
      env:
        SAASFUNNELS_API_KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail
        # A pull request is a candidate scan: compared against the series head
        # and discarded. Only the default branch advances the lineage.
        if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
          SCAN_ROLE=candidate
          REVISION="${GITHUB_HEAD_REF}@${GITHUB_SHA}"
        else
          SCAN_ROLE=series
          REVISION="${GITHUB_REF_NAME}@${GITHUB_SHA}"
        fi
        npx --yes "saasfunnels@${{ inputs.cli-version }}" features handoff \
          --file "${{ inputs.catalog-file }}" \
          --repository-key "github.com/${GITHUB_REPOSITORY}" \
          --repository-revision "${REVISION}" \
          --discovery-roots "${{ inputs.discovery-roots }}" \
          --scan-role "${SCAN_ROLE}" \
          --producer github_action \
          --api-base-url "${{ inputs.api-base-url }}" \
          --send --json > "${RUNNER_TEMP}/drift.json"
        # The CLI already formatted the summary, so this needs nothing but Node
        # built-ins. Importing saasfunnels/library here would not resolve: npx
        # does not install into the workspace, and the package is ESM-only.
        node -e '
          const fs = require("fs");
          const response = JSON.parse(
            fs.readFileSync(process.env.RUNNER_TEMP + "/drift.json", "utf8"),
          );
          const check = response.checkSummary;
          if (!check) {
            console.log(response.error || "Feature catalog scan returned no summary.");
            process.exit(0);
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, check.summary + "\n");
          console.log(check.title);
        '

    - name: Hand off plan and pricing sources
      # Staged evidence is reviewed by a human, so only the default branch
      # produces it. A pull request would stage an import per commit.
      if: inputs.plan-sources == 'true' && github.event_name != 'pull_request'
      shell: bash
      env:
        SAASFUNNELS_API_KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail
        if [ ! -f .saasfunnels/plan-sources.json ]; then
          echo "plan-sources is on but .saasfunnels/plan-sources.json is not committed."
          echo "Run 'saasfunnels plans discover --apply' locally, review the list, and commit it."
          exit 1
        fi
        if [ -z "${{ inputs.integration-id }}" ]; then
          echo "plan-sources is on but integration-id was not set."
          exit 1
        fi
        npx --yes "saasfunnels@${{ inputs.cli-version }}" plans handoff \
          --integration-id "${{ inputs.integration-id }}" \
          --repository-key "github.com/${GITHUB_REPOSITORY}" \
          --repository-revision "${GITHUB_REF_NAME}@${GITHUB_SHA}" \
          --api-base-url "${{ inputs.api-base-url }}" \
          --send
