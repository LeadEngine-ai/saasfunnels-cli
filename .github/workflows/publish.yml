name: Stage SaaSFunnels npm release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify the package or stage it for npm 2FA approval.
        required: true
        default: verify
        type: choice
        options:
          - verify
          - stage
      confirmation:
        description: Enter stage-saasfunnels-release when mode is stage.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: saasfunnels-npm-release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-candidate:
    name: Verify and stage the npm release
    if: github.ref == 'refs/heads/main'
    environment: npm-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the release revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install release npm CLI
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Verify the release candidate
        run: npm run release:verify

      - name: Confirm the irreversible staging request
        if: inputs.mode == 'stage'
        env:
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$RELEASE_CONFIRMATION" = "stage-saasfunnels-release"
          node -e 'const manifest = require("./package.json"); if (manifest.private !== false) throw new Error("The approved release manifest must be publishable"); if (manifest.license !== "MIT") throw new Error("The CLI package must remain MIT licensed")'

      - name: Stage the release on npm through OIDC
        if: inputs.mode == 'stage'
        run: npm stage publish --tag latest --access public
